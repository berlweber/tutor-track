{% extends "base.html" %} {% load static %}
{% block head %}
<link rel="stylesheet" href="{% static "css/assignments/assignment-form.css" %}">
{% endblock head %}
{% block content %}
<div class='page-header'>
    {% if assignment %}
    <div>
        <p class="eyebrow">עדכון שיבוץ</p>
        <h1>עריכת השיבוץ של '{{ assignment }}'</h1>
    </div>
    {% else %}
    <div>
        <p class="eyebrow">שיבוץ חדש</p>
        <h1>יצירת שיבוץ חדש</h1>
    </div>
    {% endif %}
</div>

<form action="" method="post" class="form-container">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class='btn'>שמור</button>
        <a href="{% url 'assignment-list' %}" class="btn secondary">ביטול</a>
    </div>
</form>
{% endblock content %}
