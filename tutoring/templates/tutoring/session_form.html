{% extends "base.html" %} {% load static %}
{% block head %}
<link rel="stylesheet" href="{% static "css/assignments/assignment-form.css" %}">
{% endblock head %}
{% block content %}
<div class='page-header'>
    <div>
        {% if object %}
        <p class="eyebrow">עריכת שיעור</p>
        <h1>עדכון שיעור</h1>
        {% else %}
        <p class="eyebrow">הוספת שיעור</p>
        <h1>הוספת שיעור עבור '{{ assignment.student }}'</h1>
        {% endif %}
    </div>
</div>

<form action="" method="post" class="form-container">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class='btn'>{% if object %}שמירת שינויים{% else %}שמירת שיעור{% endif %}</button>
        <a href="{% url 'assignment-detail' assignment.id %}" class="btn secondary">ביטול</a>
    </div>
</form>
{% endblock content %}
