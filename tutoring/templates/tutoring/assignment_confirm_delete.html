{% extends "base.html" %} {% load static %}
{% block head %}
<link rel="stylesheet" href="{% static "css/assignments/confirm-delete.css" %}">
{% endblock head %}
{% block content %}
<div class="page-header">
  <h1>מחיקת שיבוץ?</h1>
</div>
<h2 class='confirm-text'>אתה בטוח שאתה רוצה למחוק השיבוץ: <strong>"{{ object }}"</strong>?</h2>

<form action="" method="post" class="form">
  {% csrf_token %}
  <a href="{% url 'assignment-detail' assignment.id %}" class="btn secondary"> ביטול </a>
  <button type="submit" class="btn danger">כן - מחוק!</button>
</form>
{% endblock content %}
